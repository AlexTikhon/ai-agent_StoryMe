name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_ENV: test
  STORY_GENERATION_PROVIDER: mock
  CHARACTER_PROFILE_PROVIDER: mock
  IMAGE_GENERATION_PROVIDER: mock
  RUN_PAID_AI_EVALS: 'false'
  NEXT_PUBLIC_API_URL: http://localhost:3001/api
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @book/api prisma:generate
      - run: pnpm --filter @book/types build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @book/api typecheck:scripts
      - run: pnpm test
      - run: pnpm eval:story:offline
      - run: pnpm eval:interactive:offline
      - run: pnpm eval:interactive:authoring:offline
      - run: pnpm build
        env:
          NODE_ENV: production
  integration:
    name: Isolated integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @book/api prisma:generate
      - run: pnpm --filter @book/types build
      - run: pnpm test:infra:up
      # The runner permits only localhost:5440/storyme_e2e and localhost:6380/15.
      - run: pnpm --filter @book/api test:integration
      - if: always()
        run: pnpm test:infra:down
  production-browser:
    name: Production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      PRODUCT_MODE: home
      NEXT_PUBLIC_PRODUCT_MODE: home
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100/api
      NEXT_PUBLIC_AUTH_MODE: jwt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # NODE_ENV=production above makes pnpm skip devDependencies, which would
      # drop the workspace TypeScript and Playwright this job builds and runs
      # with. Install them explicitly; the build and server still run in production.
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm --filter @book/types build
      - run: pnpm --filter @book/web exec playwright install --with-deps chromium
      - run: pnpm --filter @book/web build
      - run: pnpm --filter @book/web test:e2e:production
  interactive-browser:
    name: Interactive browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @book/api prisma:generate
      - run: pnpm --filter @book/types build
      - run: pnpm --filter @book/web exec playwright install --with-deps chromium
      - run: pnpm test:infra:up
      # Playwright launches the API (migrate, seed, start) and web servers, and
      # its global teardown removes fixtures. The runner permits only
      # localhost:5440/storyme_e2e and localhost:6380/15.
      - run: pnpm --filter @book/web test:e2e e2e/interactive.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: interactive-browser-playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
      - if: always()
        timeout-minutes: 5
        run: pnpm test:infra:down
