name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_ENV: test
  STORY_GENERATION_PROVIDER: mock
  CHARACTER_PROFILE_PROVIDER: mock
  IMAGE_GENERATION_PROVIDER: mock
  RUN_PAID_AI_EVALS: 'false'
  NEXT_PUBLIC_API_URL: http://localhost:3001/api
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @book/api prisma:generate
      - run: pnpm --filter @book/types build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @book/api typecheck:scripts
      - run: pnpm test
      - run: pnpm eval:story:offline
      - run: pnpm build
        env:
          NODE_ENV: production
  integration:
    name: Isolated integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @book/api prisma:generate
      - run: pnpm --filter @book/types build
      - run: pnpm test:infra:up
      # The runner permits only localhost:5440/storyme_e2e and localhost:6380/15.
      - run: pnpm --filter @book/api test:integration
      - if: always()
        run: pnpm test:infra:down
  production-browser:
    name: Production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      PRODUCT_MODE: home
      NEXT_PUBLIC_PRODUCT_MODE: home
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100/api
      NEXT_PUBLIC_AUTH_MODE: jwt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # NODE_ENV=production above makes pnpm skip devDependencies, which would
      # drop the workspace TypeScript and Playwright this job builds and runs
      # with. Install them explicitly; the build and server still run in production.
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm --filter @book/types build
      - run: pnpm --filter @book/web exec playwright install --with-deps chromium
      - run: pnpm --filter @book/web build
      - run: pnpm --filter @book/web test:e2e:production
  book-browser:
    name: Book browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @book/api prisma:generate
      - run: pnpm --filter @book/types build
      - run: pnpm --filter @book/web exec playwright install --with-deps chromium
      - run: pnpm test:infra:up
      # Playwright launches the API (migrate, seed, start) and web servers, and
      # its global teardown removes fixtures. The runner permits only
      # localhost:5440/storyme_e2e and localhost:6380/15.
      - run: pnpm --filter @book/web test:e2e e2e/storyme.smoke.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: book-browser-playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
      - if: always()
        timeout-minutes: 5
        run: pnpm test:infra:down
  api-image:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Local build only: the image is never pushed and no registry or
      # production credentials are used.
      - run: docker build -f apps/api/Dockerfile -t storyme-api:ci .
      # Network-less, read-only, credential-free container checks: Node major
      # from .nvmrc, non-root user, entrypoints, Prisma client + engine load,
      # a Sharp transform and the embedded PDF fonts. No database is contacted.
      - run: node scripts/api-image-smoke.mjs storyme-api:ci
      # Disposable release smoke on the image built above: API and separate
      # worker containers, PostgreSQL/outbox, Redis/BullMQ and a local S3
      # gateway in a fresh Compose project, mock providers only. Cleans up its
      # own project on success, failure and cancellation. See docs/release-smoke.md.
      - run: node scripts/release-smoke.mjs --image storyme-api:ci
