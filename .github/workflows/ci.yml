name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_ENV: test
  STORY_GENERATION_PROVIDER: mock
  CHARACTER_PROFILE_PROVIDER: mock
  IMAGE_GENERATION_PROVIDER: mock
  RUN_PAID_AI_EVALS: 'false'
  NEXT_PUBLIC_API_URL: http://localhost:3001/api
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @book/api prisma:generate
      - run: pnpm --filter @book/types build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:story:offline
      - run: pnpm build
        env:
          NODE_ENV: production
  integration:
    name: Isolated integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @book/api prisma:generate
      - run: pnpm --filter @book/types build
      - run: pnpm test:infra:up
      # The runner permits only localhost:5440/storyme_e2e and localhost:6380/15.
      - run: pnpm --filter @book/api test:integration
      - if: always()
        run: pnpm test:infra:down
