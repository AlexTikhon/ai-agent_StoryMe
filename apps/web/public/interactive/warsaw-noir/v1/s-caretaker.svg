<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0c0f"/><stop offset="1" stop-color="#1b1f25"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f6c76f" stop-opacity=".6"/><stop offset=".45" stop-color="#e8a33d" stop-opacity=".18"/><stop offset="1" stop-color="#e8a33d" stop-opacity="0"/></radialGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39424d"/><stop offset="1" stop-color="#171a1f"/></linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
    <pattern id="rain" width="90" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><path d="M12 4v34M52 20v28M78 60v32M30 70v26M64 100v10" stroke="#aab4be" stroke-width="1.3" stroke-opacity=".3"/></pattern>
    <pattern id="brick" width="60" height="28" patternUnits="userSpaceOnUse"><path d="M0 .5h60M0 14.5h60M30 0v14M0 14v14M60 14v14" stroke="#0b0d10" stroke-width="2" fill="none" opacity=".75"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- gateway arch seen from inside the yard: street beyond -->
  <rect x="0" y="0" width="1200" height="800" fill="#1a1d22"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#brick)"/>
  <path d="M250 800V330Q250 120 600 120T950 330V800z" fill="url(#street)"/>
  <path d="M250 800V330Q250 120 600 120T950 330V800" fill="none" stroke="#0b0d10" stroke-width="22"/>
  <!-- street beyond the arch -->
  <path d="M290 560h620M290 600h620" stroke="#0e1013" stroke-width="3" opacity=".6"/>
  <rect x="330" y="360" width="90" height="120" fill="#0f1114" opacity=".8"/>
  <rect x="460" y="330" width="70" height="150" fill="#0f1114" opacity=".7"/>
  <circle cx="390" cy="420" r="5" fill="#f6c76f"/>
  <circle cx="495" cy="388" r="5" fill="#f6c76f" opacity=".8"/>
  <!-- cobbles -->
  <polygon points="0,800 0,640 250,600 950,600 1200,640 1200,800" fill="#14171b"/>
  <ellipse cx="520" cy="700" rx="230" ry="26" fill="#2c333b" opacity=".8"/>
  <ellipse cx="520" cy="700" rx="230" ry="26" fill="none" stroke="#f6c76f" stroke-opacity=".25" stroke-width="2"/>
  <!-- hanging lamp -->
  <path d="M470 0v118" stroke="#0b0d10" stroke-width="5"/>
  <circle cx="470" cy="150" r="300" fill="url(#glow)"/>
  <path d="M446 118h48l12 34h-72z" fill="#0b0d10"/>
  <rect x="456" y="150" width="28" height="30" fill="#f6c76f"/>
  <!-- long shadow of the caretaker -->
  <polygon points="760,740 1080,790 1170,800 660,800" fill="#050607" opacity=".7"/>
  <!-- bins and bucket at left -->
  <g fill="#0b0d10">
    <rect x="60" y="560" width="120" height="170"/>
    <rect x="52" y="548" width="136" height="20"/>
    <rect x="200" y="640" width="64" height="90"/>
  </g>
  <rect x="64" y="590" width="112" height="6" fill="#2c333b"/>
  <!-- caretaker with broom, close and large -->
  <g fill="#08090b">
    <circle cx="700" cy="296" r="46"/>
    <path d="M668 262q32-34 64 0z"/>
    <circle cx="700" cy="244" r="20"/>
    <path d="M630 350q70-28 140 0l40 270h-220z"/>
    <path d="M640 620h74l-8 140h-60zM726 620h74l8 140h-60z"/>
  </g>
  <path d="M690 322q10 8 20 0" stroke="#e8a33d" stroke-opacity=".5" stroke-width="3" fill="none"/>
  <path d="M606 420L880 760" stroke="#2a2f36" stroke-width="10"/>
  <path d="M606 420L880 760" stroke="#e8a33d" stroke-opacity=".25" stroke-width="2"/>
  <polygon points="846,716 930,742 912,798 826,768" fill="#3a3226"/>
  <path d="M846 716l-4 56M864 724l-6 56M884 730l-8 56M904 736l-9 56" stroke="#14171b" stroke-width="3"/>
  <rect x="640" y="420" width="130" height="8" fill="#e8a33d" opacity=".4"/>
  <rect width="1200" height="800" fill="url(#rain)"/>
  <rect width="1200" height="800" fill="url(#vig)"/>
</svg>
