<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0c0f"/><stop offset="1" stop-color="#1b1f25"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f6c76f" stop-opacity=".6"/><stop offset=".45" stop-color="#e8a33d" stop-opacity=".18"/><stop offset="1" stop-color="#e8a33d" stop-opacity="0"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c76f" stop-opacity=".42"/><stop offset="1" stop-color="#f6c76f" stop-opacity="0"/></linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></radialGradient>
    <pattern id="rain" width="90" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><path d="M12 4v34M52 20v28M78 60v32M30 70v26M64 100v10" stroke="#aab4be" stroke-width="1.6" stroke-opacity=".4"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- window with curtains, rain outside -->
  <rect x="70" y="90" width="300" height="400" fill="#27303a"/>
  <rect x="70" y="90" width="300" height="400" fill="url(#rain)"/>
  <path d="M220 90v400M70 290h300" stroke="#0b0d10" stroke-width="10"/>
  <rect x="70" y="90" width="300" height="400" fill="none" stroke="#0b0d10" stroke-width="14"/>
  <path d="M40 70h110l-30 460H40zM300 70h100v460h-70z" fill="#16191d"/>
  <!-- wall shelf with books -->
  <rect x="760" y="150" width="340" height="12" fill="#0b0d10"/>
  <g fill="#0b0d10"><rect x="780" y="94" width="26" height="56"/><rect x="812" y="104" width="22" height="46"/><rect x="840" y="88" width="30" height="62"/><rect x="900" y="110" width="24" height="40"/><rect x="930" y="98" width="28" height="52"/></g>
  <!-- floor and wall line -->
  <rect x="0" y="560" width="1200" height="240" fill="#121519"/>
  <path d="M0 560h1200" stroke="#0b0d10" stroke-width="6"/>
  <!-- chair silhouette -->
  <g fill="#07080a"><rect x="470" y="440" width="120" height="14"/><rect x="474" y="454" width="10" height="150"/><rect x="576" y="454" width="10" height="150"/><rect x="470" y="300" width="14" height="150"/><rect x="478" y="316" width="112" height="12"/></g>
  <!-- desk -->
  <rect x="560" y="470" width="600" height="30" fill="#2a2420"/>
  <rect x="560" y="500" width="600" height="12" fill="#0b0d10"/>
  <rect x="590" y="512" width="26" height="240" fill="#1a1613"/>
  <rect x="1100" y="512" width="26" height="240" fill="#1a1613"/>
  <!-- the lamp that is still burning -->
  <polygon points="888,290 1044,290 1190,600 750,600" fill="url(#cone)"/>
  <circle cx="966" cy="300" r="330" fill="url(#glow)"/>
  <path d="M930 470h72v-18h-72zM966 452v-140" stroke="#0b0d10" stroke-width="10" fill="none"/>
  <path d="M966 312L890 270l60-26 94 36z" fill="#0b0d10"/>
  <ellipse cx="966" cy="288" rx="52" ry="12" fill="#f6c76f"/>
  <!-- note taped under the lamp, no readable text -->
  <polygon points="1010,420 1074,416 1078,468 1014,472" fill="#d9d0b8"/>
  <path d="M1020 436l46-2M1020 448l40-2M1020 460l30-2" stroke="#8a8068" stroke-width="3"/>
  <!-- cold, half-eaten meal -->
  <ellipse cx="750" cy="462" rx="92" ry="18" fill="#8b9096" opacity=".85"/>
  <ellipse cx="750" cy="458" rx="64" ry="11" fill="#3b2f26"/>
  <path d="M722 454q18-14 36-2" stroke="#6b5538" stroke-width="5" fill="none"/>
  <path d="M846 452l66 8M846 458l66 6" stroke="#8b9096" stroke-width="3"/>
  <rect x="640" y="436" width="34" height="34" fill="#6b7580" opacity=".75"/>
  <path d="M674 446q16 0 16 12t-16 8" stroke="#6b7580" stroke-width="5" fill="none"/>
  <!-- loose papers -->
  <polygon points="1086,466 1150,460 1156,490 1090,496" fill="#bdb49c" opacity=".85"/>
  <polygon points="1102,452 1160,448 1162,470 1106,476" fill="#d3caae" opacity=".8"/>
  <rect width="1200" height="800" fill="url(#vig)"/>
</svg>
